name: DeepCatch Validation

on: [push, workflow_dispatch]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy scipy scikit-learn pandas

      - name: Full validation suite
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" python3 << 'PYEOF'
          import numpy as np, traceback; np.random.seed(42)
          from validation.py import config
          from validation.py.statistical_tests import compute_auc, delong_test, bootstrap_ci, sensitivity_at_specificity, bonferroni_correct
          from validation.py.performance_weighted_fusion import performance_weighted_fusion, simple_average_fusion
          from validation.py.cet_validation import run_cet_validation
          from validation.py.tcga_loader import load_tcga_data
          from validation.py.head_to_head import run_head_to_head
          print("✅ ALL modules imported\n")

          passed = 0; failed = 0
          def run_section(name, fn):
            global passed, failed
            try:
              fn()
              passed += 1
              print(f"✅ {name}")
            except Exception as e:
              failed += 1
              print(f"❌ {name}: {e}")

          def test_fusion():
            n=2000; nc=600; labels=np.zeros(n); labels[:nc]=1; np.random.shuffle(labels)
            scores=[np.clip(0.3+0.4*(labels if a>0.6 else 1-labels)*a+np.random.normal(0,0.15,n),0,1) for a in [0.8,0.55,0.6,0.7,0.85]]
            avg=simple_average_fusion(scores); avg_auc=compute_auc(avg,labels)
            r=performance_weighted_fusion(scores,[labels]*len(scores))
            wtd=r['fused_scores']; wtd_auc=compute_auc(wtd,labels)
            dr=delong_test(labels,avg,wtd)
            print(f"  Simple avg: AUC={avg_auc:.4f}  Weighted: AUC={wtd_auc:.4f}")
            print(f"  Delta: {dr['delta_auc']:+.4f}  p={dr['p_value']:.4f}  {'✅ SIG' if dr['significant'] else 'NS'}")
            print(f"  Weights: {[f'{w:.3f}' for w in r['weights']]}")

          def test_stats():
            n=500; y=np.random.binomial(1,0.3,n); s=y*0.7+np.random.normal(0,0.25,n)
            ci=bootstrap_ci(y,s,n_bootstrap=1000); sens=sensitivity_at_specificity(y,s,0.99)
            pc=bonferroni_correct([0.001,0.01,0.04,0.08,0.15])
            print(f"  AUC CI95: [{ci['lo']:.4f},{ci['hi']:.4f}]  Sens@99%: {sens:.4f}")
            print(f"  Bonferroni: {[f'{p:.4f}' for p in pc]}")

          def test_cet():
            cet=run_cet_validation()
            print(f"  AUC={cet['auc']:.4f}  Sens={cet['sensitivity']*100:.1f}%  Spec={cet['specificity']*100:.1f}%")
            print(f"  Dual target (S>=70+Sp>=95): {'✅ MET' if cet['sensitivity']>=0.7 and cet['specificity']>=0.95 else 'NOT MET'}")

          def test_h2h():
            tcga=load_tcga_data()
            h2h=run_head_to_head(tcga,ctdna_levels=config.CTDNA_LEVELS[:3],n_folds=5)
            for ct,rx in h2h.items():
              dd=rx['dc_multimodal']['auc']-rx['bie_themis']['auc']; pv=rx.get('delong_p',1)
              print(f"  ctDNA {ct*100:.1f}%: DC={rx['dc_multimodal']['auc']:.4f}  Bie={rx['bie_themis']['auc']:.4f}  D={dd:+.4f}  p={pv:.4f}  {'⭐' if pv<0.05 else ''}")

          run_section("FUSION", test_fusion)
          run_section("STATS", test_stats)
          run_section("CET", test_cet)
          run_section("HEAD-TO-HEAD", test_h2h)

          print(f"\n{'='*40}\n{passed} passed, {failed} failed")
          if failed > 0: exit(1)
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: deepcatch-validation-results
          path: results/
