name: DeepCatch Validation

on: [push, workflow_dispatch]

jobs:
  # ── Core tests (no torch) ──────────────────────────────────────────────
  core-tests:
    name: Core tests (fragmentomics, preprocessing, clinical, fusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy scipy scikit-learn pandas matplotlib seaborn pytest
      - name: Run core test suite
        run: |
          python -m pytest src/fragmentomics src/preprocessing src/clinical \
            src/multimodal_fusion test/ -q --no-header

  # ── Deep-learning module tests (torch + torch_geometric) ──────────────
  dl-tests:
    name: DL tests (foundation, GNN, tissue deconv, priming)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy scipy scikit-learn pandas matplotlib seaborn pytest
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -q torch_geometric
      - name: Run DL module tests
        run: |
          python -m pytest src/foundation src/tissue_deconv src/priming \
            src/methylation_gnn -q --no-header

  # ── Real-data pipeline smoke test (no data download) ──────────────────
  # Verifies the real-TCGA validation fails LOUDLY (not silently) when no
  # real MAF data is present — the synthetic fallback must never be used.
  real-data-guard:
    name: Real-data guard (fail-loud check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy scipy scikit-learn pandas
      - name: real_tcga_validation must refuse synthetic fallback
        run: |
          set -e
          set -o pipefail   # pipeline exit = python exit, not tee's
          mkdir -p /tmp/empty_cache
          if python3 real_tcga_validation.py --cache-dir /tmp/empty_cache \
              --no-download --n-patients 5 --output /tmp/out.json 2>&1 | tee /tmp/guard.log; then
            echo "❌ FAIL: script should have exited non-zero without real data"
            exit 1
          fi
          grep -q "SYNTHETIC" /tmp/guard.log && echo "✅ correctly refuses synthetic fallback" || exit 1

  # ── Tumor-naive adapter + fusion integration smoke ──────────────────
  # Exercises the cfdna-fragmentomics-pipeline adapter end-to-end with a
  # synthetic mini-cohort so future breakage is caught without a 627-sample
  # FinaleDB download.
  tumor-naive-integration:
    name: Tumor-naive + fusion integration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy scipy scikit-learn pandas matplotlib seaborn pytest
      - name: Smoke (synthetic cohort, no network)
        run: python3 scripts/smoke_tumor_naive_integration.py
      - name: Unit tests
        run: |
          python -m pytest test/test_tumor_naive_adapter.py \
            test/test_fusion_ablation.py -v --no-header

  # ── DeepCatch simulation smoke test (kept from previous CI) ───────────
  # NOTE: this is a code-path smoke test on synthetic data, NOT a real-data
  # performance test. Renamed accordingly.
  smoke-test:
    name: Simulation smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy scipy scikit-learn pandas

      - name: DeepCatch Simulation Smoke Test
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" python3 << 'PYEOF'
          import numpy as np; np.random.seed(42)
          from validation.py import config
          from validation.py.statistical_tests import compute_auc, delong_test, bootstrap_ci, sensitivity_at_specificity, bonferroni_correct
          from validation.py.performance_weighted_fusion import performance_weighted_fusion, simple_average_fusion
          from validation.py.cet_validation import run_cet_validation

          print("="*60)
          print("  DeepCatch Simulation Smoke Test (synthetic data)")
          print("  https://github.com/rollroyces/deepcatch")
          print("="*60)

          # TEST 1: Multi-Modal Fusion
          n=2000; nc=600; labels=np.zeros(n); labels[:nc]=1; np.random.shuffle(labels)
          scores=[np.clip(0.3+0.4*(labels if a>0.6 else 1-labels)*a+np.random.normal(0,0.15,n),0,1) for a in [0.8,0.55,0.6,0.7,0.85]]
          avg=simple_average_fusion(scores)
          r=performance_weighted_fusion(scores,[labels]*len(scores))
          dr=delong_test(labels,avg,r['fused_scores'])
          print(f"\n  [1] MULTI-MODAL FUSION")
          print(f"      Simple average (Bie 2023):  AUC = {compute_auc(avg,labels):.4f}")
          print(f"      Performance-weighted (DC):   AUC = {compute_auc(r['fused_scores'],labels):.4f}")
          print(f"      Delta: {dr['delta_auc']:+.4f}  p={dr['p_value']:.4f}")

          # TEST 2: Statistical Inference
          n2=500; y2=np.random.binomial(1,0.3,n2); s2=y2*0.7+np.random.normal(0,0.25,n2)
          ci=bootstrap_ci(y2,s2,n_bootstrap=1000)
          sens=sensitivity_at_specificity(y2,s2,0.99)
          pc=bonferroni_correct([0.001,0.01,0.04,0.08,0.15])
          print(f"\n  [2] STATISTICAL INFERENCE")
          print(f"      AUC 95% CI: [{ci['lo']:.4f}, {ci['hi']:.4f}]")
          print(f"      Sensitivity at 99% specificity: {sens:.4f}")
          print(f"      Bonferroni correction: OK")

          # TEST 3: CET Longitudinal
          cet=run_cet_validation()
          perf=cet['performance']
          print(f"\n  [3] CET LONGITUDINAL TRACKING (simulation)")
          print(f"      AUC: {perf['auc']:.4f}")
          print(f"      Sensitivity: {perf['sensitivity']*100:.1f}%")
          print(f"      Specificity: {perf['specificity_overall']*100:.1f}%")
          print(f"      Dual target (S>=70% + Sp>=95%): {cet['targets']['both_met']}")

          print(f"\n  {'='*60}")
          print(f"  ✅ SIMULATION SMOKE TEST PASSED (synthetic data only —")
          print(f"      NOT evidence of clinical performance)")
          print(f"  {'='*60}")
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: deepcatch-results
          path: results/
