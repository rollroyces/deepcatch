name: Deploy DeepCatch docs site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Note: deploys docs/site/ (the public-facing landing page) rather than
# docs/ root. The docs/ root now contains a README.md that renders on
# github.com and links to the deployed /site/ sub-page.

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel any in-flight deploys when a new push arrives — Pages hosts one
# build at a time, so this prevents stuck runs from blocking a fresh release.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Pin Node 24 explicitly to avoid the "Node.js 20 is deprecated"
      # runner warning. actions/checkout@v5+ and the rest of the Pages
      # stack now require Node 24.
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
