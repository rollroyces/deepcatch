name: Deploy DeepCatch docs site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Note: deploys docs/site/ (the public-facing landing page) rather than
# docs/ root. The docs/ root now contains a README.md that renders on
# github.com. The artifact is uploaded from ./docs/site, and GitHub
# Pages serves its index.html at the project root URL.

permissions:
  contents: read
  pages: write
  id-token: write

# Serialise the deploys: Pages hosts one build at a time, and a run that
# is cancelled mid-flight can leave its artifact uploaded to blob storage
# but NOT registered with the artifact API -- the next deploy then fails
# with "Found 0 artifact(s)" even though its own upload succeeded. That
# is exactly what happened on 2026-11-23 (two pushes four minutes
# apart: the first deploy was cancelled while its upload was being
# finalised, and the second could not see any artifact). GitHub's own
# Pages template uses `cancel-in-progress: false` for the same reason.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Pin Node 24 explicitly to avoid the "Node.js 20 is deprecated"
      # runner warning. actions/checkout@v5+ and the rest of the Pages
      # stack now require Node 24.
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
