name: Compile Paper PDF

on:
  push:
    paths:
      - 'paper/deepcatch_final.tex'
      - 'paper/supplementary.tex'
      - 'paper/references_final.bib'
      - 'paper/paper.tex'
      - 'paper/*.pdf'
      # the manuscript embeds these, so a figure change must re-trigger it
      - 'docs/figures/**'
      - 'results/real_tcga_performance.png'
      # the arXiv source bundle is built from the manuscript, so a change
      # to its builder must re-trigger the job that verifies it
      - 'scripts/make_arxiv_bundle.py'
  workflow_dispatch:

# One paper build at a time per branch, and the newer one wins.
#
# Two paper builds at once are not two independent jobs: the TeX Live
# install in the first one holds the apt lock, and the second one waits
# behind it for tens of minutes. A superseded commit's PDF is not worth
# waiting for -- the PDF that matters is the one built from the commit
# that is still the head.
concurrency:
  group: compile-paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-science texlive-fonts-recommended \
            texlive-bibtex-extra biber

      - name: Compile Paper
        working-directory: paper
        run: |
          # Try bioinfo class first, fall back to article
          if kpsewhich bioinfo.cls > /dev/null 2>&1; then
            echo "bioinfo.cls found — using journal template"
          else
            echo "bioinfo.cls not found — using article class"
          fi
          # The submission manuscript is compiled FIRST, because it is the
          # one that must build. The deprecated v1.0 draft used to be
          # compiled first, and a LaTeX error in it failed the job before
          # it ever reached paper.tex -- so a broken draft took the
          # submission PDF down with it.
          if [ -f paper.tex ]; then
            echo "── paper.tex (v2.2 benchmark) ──"
            pdflatex -interaction=nonstopmode paper.tex
            pdflatex -interaction=nonstopmode paper.tex
            ls -lh paper.pdf
          fi
          # The deprecated draft is kept for the record, not for
          # submission, so a LaTeX error in it is reported and the job
          # still finishes with the submission PDF.
          if [ -f deepcatch_final.tex ]; then
            echo "── deepcatch_final.tex (deprecated v1.0 draft) ──"
            pdflatex -interaction=nonstopmode deepcatch_final.tex \
              || echo "::warning::the deprecated draft did not compile; the submission PDF is unaffected"
            bibtex deepcatch_final || true
            pdflatex -interaction=nonstopmode deepcatch_final.tex || true
            pdflatex -interaction=nonstopmode deepcatch_final.tex || true
            ls -lh deepcatch_final.pdf || true
          fi

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: deepcatch-paper
          path: paper/*.pdf
          retention-days: 90
          if-no-files-found: error

      # The arXiv source bundle is the fallback venue's artefact, and the
      # submission PDF is uploaded before this runs on purpose: a broken
      # bundle must never take the submission artefact down with it. The
      # step reports the failure as a warning instead of failing the job.
      - name: Verify the arXiv source bundle
        continue-on-error: true
        run: |
          if python scripts/make_arxiv_bundle.py --verify; then
            echo "::notice::the arXiv source bundle compiles standalone"
          else
            echo "::warning::the arXiv source bundle did not verify; the submission PDF above is unaffected"
          fi

      # The bundle is uploaded rather than left on one person's machine:
      # a source archive is what arXiv receives, and a local copy can be
      # stale (it is a build product, not a tracked file). Building it
      # here means the archive downloadable from this run is the one that
      # was made from the committed manuscript. `if-no-files-found: warn`
      # keeps the job green when the bundle step above failed — the PDF
      # artefact is the one that must not be taken down.
      - name: Upload the arXiv source bundle
        uses: actions/upload-artifact@v4
        with:
          name: deepcatch-arxiv-source
          path: dist/deepcatch_v2_3_0.tar.gz
          retention-days: 90
          if-no-files-found: warn
