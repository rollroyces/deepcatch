name: Compile Paper PDF

on:
  push:
    paths:
      - 'paper/deepcatch_final.tex'
      - 'paper/supplementary.tex'
      - 'paper/references_final.bib'
      - 'paper/paper.tex'
      - 'paper/PAPER.md'
      - 'paper/figures/**'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-science texlive-fonts-recommended \
            texlive-bibtex-extra biber

      - name: Compile Paper
        working-directory: paper
        run: |
          # Try bioinfo class first, fall back to article
          if kpsewhich bioinfo.cls > /dev/null 2>&1; then
            echo "bioinfo.cls found — using journal template"
          else
            echo "bioinfo.cls not found — using article class"
          fi
          # Compile whichever paper sources exist (main + benchmark papers)
          if [ -f deepcatch_final.tex ]; then
            echo "── deepcatch_final.tex ──"
            pdflatex -interaction=nonstopmode deepcatch_final.tex
            bibtex deepcatch_final || true
            pdflatex -interaction=nonstopmode deepcatch_final.tex
            pdflatex -interaction=nonstopmode deepcatch_final.tex
            ls -lh deepcatch_final.pdf
          fi
          if [ -f paper.tex ]; then
            echo "── paper.tex (v2.2 benchmark) ──"
            pdflatex -interaction=nonstopmode paper.tex
            pdflatex -interaction=nonstopmode paper.tex
            ls -lh paper.pdf
          fi

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: deepcatch-paper
          path: paper/*.pdf
          retention-days: 90
          if-no-files-found: error
